<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Speedcom | Copier & IT Rental Solutions</title>
    
    <meta name="description" content="Read the latest updates from Metro Speedcom. We provide reliable Kyocera and Samsung copier rentals and IT solutions across Metro Manila and Tarlac.">
    <link rel="canonical" href="https://metro-speedcom.netlify.app/article.html" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .prose p { margin-bottom: 1.5rem; line-height: 1.8; color: #374151; }
        .prose h2 { font-size: 1.875rem; font-weight: 700; margin-top: 2.5rem; margin-bottom: 1.25rem; color: #111827; }
        .prose strong { color: #111827; font-weight: 600; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.5rem; }
        .prose li { margin-bottom: 0.5rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <nav class="bg-white border-b py-4 px-6 flex justify-between items-center shadow-sm sticky top-0 z-50">
        <a href="/" class="flex items-center gap-2">
            <img src="/logo.PNG" alt="Logo" class="h-10">
            <span class="font-bold text-slate-900 uppercase tracking-tight">METRO SPEEDCOM</span>
        </a>
        <a href="/blog.html" class="text-blue-700 font-semibold">← Back to Blog</a>
    </nav>

    <article class="max-w-4xl mx-auto py-12 px-6">
        <div id="article-content" class="bg-white p-8 md:p-12 rounded-3xl shadow-sm border border-slate-100 min-h-[500px]">
            <div class="text-center py-20" id="loading">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600 mb-4"></i>
                <p class="text-slate-500">Loading full article content...</p>
            </div>
        </div>
    </article>

    <footer class="bg-slate-900 text-slate-400 py-12 text-center">
        <p class="mb-2 text-white font-bold uppercase tracking-widest">Metro Speedcom Corporation</p>
        <p>&copy; 2026. All rights reserved.</p>
    </footer>

    <script>
        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            const postFile = params.get('post');
            const container = document.getElementById('article-content');

            if (!postFile) { window.location.href = '/blog.html'; return; }

            try {
                const response = await fetch(`https://api.github.com/repos/mscjoana-ship-it/metro-speedcom/contents/posts/${postFile}?t=${new Date().getTime()}`);
                const data = await response.json();
                
                // Securely decode Base64 content
                const content = decodeURIComponent(escape(atob(data.content))); 

                // --- DATA CLEANING LOGIC ---
                const titleMatch = content.match(/title:\s*["']?(.*?)["']?$/m);
                const thumbMatch = content.match(/thumbnail:\s*["']?(.*?)["']?$/m);
                
                const title = titleMatch ? titleMatch[1] : "Metro Speedcom Update";
                const img = thumbMatch ? thumbMatch[1] : "";

                // STRIP FRONTMATTER
                let bodyText = content;
                const separator = "---";
                const firstIndex = content.indexOf(separator);
                if (firstIndex !== -1) {
                    const secondIndex = content.indexOf(separator, firstIndex + separator.length);
                    if (secondIndex !== -1) {
                        bodyText = content.substring(secondIndex + separator.length).trim();
                    }
                }

                container.innerHTML = `
                    <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 mb-8 leading-tight">${title}</h1>
                    ${img ? `<img src="${img}" class="w-full h-auto max-h-[500px] object-cover rounded-2xl mb-10 shadow-md">` : ''}
                    
                    <div class="prose max-w-none text-slate-700">
                        ${marked.parse(bodyText)}
                    </div>

                    <div class="mt-16 pt-10 border-t border-slate-200 text-center">
                        <h3 class="text-2xl font-bold text-slate-900 mb-4 tracking-tight">Interested in this solution?</h3>
                        <p class="text-slate-600 mb-8 text-lg">Contact Metro Speedcom today for reliable copier and IT rentals.</p>
                        <a href="/index.html#contact" class="inline-block bg-blue-700 text-white px-10 py-4 rounded-full font-bold shadow-lg hover:bg-blue-800 transition-all transform hover:scale-105">
                            Get a Free Quote
                        </a>
                    </div>
                `;
                
                document.title = title + " | Metro Speedcom";

            } catch (err) {
                console.error("Error loading article:", err);
                container.innerHTML = `
                    <div class="text-center py-10">
                        <h2 class="text-2xl font-bold text-red-600">Article not found.</h2>
                        <p class="mt-4 text-slate-600">This post may be unavailable at the moment.</p>
                        <a href="/blog.html" class="mt-6 inline-block text-blue-700 font-bold hover:underline">← Return to Blog</a>
                    </div>`;
            }
        }
        
        loadArticle();
    </script>
</body>
</html>
