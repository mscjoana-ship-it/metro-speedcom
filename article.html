<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Speedcom | Article</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <nav class="bg-white border-b py-4 px-6 flex justify-between items-center shadow-sm sticky top-0 z-50">
        <a href="/" class="flex items-center gap-2">
            <img src="/logo.PNG" alt="Logo" class="h-10">
            <span class="font-bold text-slate-800 uppercase tracking-tight">METRO SPEEDCOM</span>
        </a>
        <a href="/blog.html" class="text-blue-700 font-semibold">← Back to Blog</a>
    </nav>

    <article class="max-w-4xl mx-auto py-12 px-6">
        <div id="article-content" class="bg-white p-8 md:p-12 rounded-3xl shadow-sm border border-slate-100 min-h-[500px]">
            <div class="text-center py-20" id="loading">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600 mb-4"></i>
                <p class="text-slate-500">Loading article...</p>
            </div>
        </div>
    </article>

    <footer class="bg-slate-900 text-slate-400 py-12 text-center">
        <p class="mb-2 text-white font-bold uppercase tracking-widest">Metro Speedcom Corporation</p>
        <p>&copy; 2026. All rights reserved.</p>
    </footer>

    <script>
        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            const postFile = params.get('post');
            const container = document.getElementById('article-content');

            if (!postFile) { window.location.href = '/blog.html'; return; }

            try {
                const response = await fetch(`https://api.github.com/repos/mscjoana-ship-it/metro-speedcom/contents/posts/${postFile}`);
                const data = await response.json();
                
                // Decode the content from GitHub
                const content = decodeURIComponent(escape(atob(data.content))); 

                // 1. Split the "Frontmatter" (the CMS settings) from the "Body" (your story)
                const parts = content.split('---');
                let body = "";
                let title = "Metro Speedcom Update";
                let img = "";

                if (parts.length >= 3) {
                    const frontmatter = parts[1];
                    body = parts.slice(2).join('---'); // Everything after the second ---
                    
                    // Extract data from frontmatter
                    title = frontmatter.match(/title:\s*["']?(.*?)["']?$/m)?.[1] || title;
                    img = frontmatter.match(/thumbnail:\s*["']?(.*?)["']?$/m)?.[1] || "";
                } else {
                    body = content; // Fallback if no frontmatter
                }

                // 2. Render the clean HTML
                container.innerHTML = `
                    <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 mb-8 leading-tight">${title}</h1>
                    ${img ? `<img src="${img}" class="w-full h-auto max-h-[450px] object-cover rounded-2xl mb-10 shadow-md">` : ''}
                    
                    <div class="prose prose-blue max-w-none text-lg leading-relaxed text-slate-700">
                        ${marked.parse(body)}
                    </div>

                    <div class="mt-16 pt-10 border-t border-slate-100 text-center">
                        <h3 class="text-2xl font-bold text-slate-900 mb-4">Interested in this solution?</h3>
                        <p class="text-slate-600 mb-8">Contact our experts today for a customized rental package.</p>
                        <a href="/index.html#contact" class="inline-block bg-blue-700 text-white px-10 py-4 rounded-full font-bold shadow-lg hover:bg-blue-800 transition-all transform hover:scale-105">
                            Get a Quote Now
                        </a>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                container.innerHTML = "<div class='text-center'> <h2 class='text-2xl font-bold'>Article not found.</h2><p class='mt-4'><a href='/blog.html' class='text-blue-600 underline'>Return to Blog</a></p></div>";
            }
        }
        loadArticle();
    </script>
</body>
</html>
