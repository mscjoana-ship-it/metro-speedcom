<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Speedcom | Article</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <nav class="bg-white border-b py-4 px-6 flex justify-between items-center shadow-sm sticky top-0 z-50">
        <a href="/" class="flex items-center gap-2">
            <img src="/logo.PNG" alt="Logo" class="h-10">
            <span class="font-bold text-slate-800 uppercase">METRO SPEEDCOM</span>
        </a>
        <a href="/blog.html" class="text-blue-700 font-semibold">← Back to Blog</a>
    </nav>

    <article class="max-w-4xl mx-auto py-16 px-6">
        <div id="article-content" class="bg-white p-8 md:p-12 rounded-3xl shadow-sm border border-slate-100">
            <div class="animate-pulse flex flex-col gap-4">
                <div class="h-8 bg-slate-200 rounded w-3/4"></div>
                <div class="h-64 bg-slate-200 rounded"></div>
                <div class="h-4 bg-slate-200 rounded"></div>
            </div>
        </div>
    </article>

    <footer class="bg-slate-900 text-slate-400 py-12 text-center">
        <p class="mb-2 text-white font-bold uppercase">Metro Speedcom Corporation</p>
        <p>&copy; 2026. All rights reserved.</p>
    </footer>

    <script>
        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            const postFile = params.get('post');
            const container = document.getElementById('article-content');

            if (!postFile) { window.location.href = '/blog.html'; return; }

            try {
                const response = await fetch(`https://api.github.com/repos/mscjoana-ship-it/metro-speedcom/contents/posts/${postFile}`);
                const data = await response.json();
                const content = atob(data.content); // Decode from Base64

                // Split frontmatter from body
                const parts = content.split('---');
                const body = parts[2];
                const title = content.match(/title:\s*["']?(.*?)["']?$/m)?.[1];
                const img = content.match(/thumbnail:\s*["']?(.*?)["']?$/m)?.[1];

                container.innerHTML = `
                    <h1 class="text-4xl font-extrabold text-slate-900 mb-6 leading-tight">${title}</h1>
                    <img src="${img}" class="w-full h-80 object-cover rounded-2xl mb-8 shadow-sm">
                    <div class="prose prose-slate max-w-none text-lg leading-relaxed text-slate-700">
                        ${marked.parse(body)}
                    </div>
                    <div class="mt-12 pt-8 border-t border-slate-100 text-center">
                        <h3 class="text-xl font-bold mb-4">Ready to optimize your office?</h3>
                        <a href="/index.html#contact" class="inline-block bg-blue-700 text-white px-8 py-3 rounded-full font-bold">Inquire About This Equipment</a>
                    </div>
                `;
            } catch (err) {
                container.innerHTML = "<h2>Article not found.</h2>";
            }
        }
        loadArticle();
    </script>
</body>
</html>
