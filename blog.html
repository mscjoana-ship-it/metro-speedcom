<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Blog | Metro Speedcom Corporation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <nav class="bg-white border-b py-4 px-6 flex justify-between items-center shadow-sm sticky top-0 z-50">
        <a href="/" class="flex items-center gap-2">
            <img src="/logo.PNG" alt="Logo" class="h-10" onerror="this.src='logo.png'">
            <span class="font-bold text-slate-800 uppercase">METRO SPEEDCOM</span>
        </a>
        <a href="/" class="text-blue-700 font-semibold hover:underline">← Home</a>
    </nav>

    <header class="py-16 bg-slate-900 text-white text-center">
        <h1 class="text-4xl font-extrabold mb-4">Latest Insights & Updates</h1>
        <p class="text-slate-400 px-4">Trusted IT and Copier Solutions for BPOs and PEZA Locators in Metro Manila & Tarlac.</p>
    </header>

    <main class="max-w-6xl mx-auto py-12 px-6">
        <div id="posts-container" class="grid gap-8">
            <div class="text-center py-20" id="loading-state">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600 mb-4"></i>
                <p class="text-slate-500">Connecting to Metro Speedcom updates...</p>
            </div>
        </div>
    </main>
    
    <footer class="bg-slate-900 text-slate-400 py-12 text-center">
        <p class="mb-2 text-white font-bold uppercase tracking-widest">Metro Speedcom Corporation</p>
        <p>&copy; 2026. All rights reserved.</p>
    </footer>

    <script>
        const GITHUB_USER = "mscjoana-ship-it"; 
        const REPO_NAME = "metro-speedcom";             

        async function fetchPosts() {
            const container = document.getElementById('posts-container');
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/posts`;

            try {
                const response = await fetch(apiUrl);
                let mdFiles = [];
                
                if (response.ok) {
                    // If the repository is ever made public or token-authorized
                    const files = await response.json();
                    mdFiles = files
                        .filter(f => f.name.toLowerCase().endsWith('.md'))
                        .sort((a, b) => b.name.localeCompare(a.name));
                } else {
                    // PRIVATE REPO FALLBACK: Read directly via Netlify routing using your exact filenames
                    const hardcodedFiles = [
                        "2026-03-11-reliable-copier-rental-services-for-businesses-in-metro-manila-peza-zones-1.md",
                        "2026-03-11-reliable-copier-rental-services-for-businesses-in-metro-manila-peza-zones.md",
                        "2026-02-06-efficient-copier-it-rentals.md"
                    ];
                    
                    mdFiles = hardcodedFiles.map(name => ({
                        name: name,
                        download_url: `/posts/${name}?t=${new Date().getTime()}` // Cache buster included
                    }));
                }

                if (mdFiles.length === 0) {
                    showEmptyState(container);
                    return;
                }

                container.innerHTML = ''; 

                // Loop and render the files
                for (const file of mdFiles) {
                    try {
                        const contentRes = await fetch(file.download_url);
                        if (!contentRes.ok) continue; 

                        const text = await contentRes.text();

                        // Regex structures to capture parameters across formatting variations
                        const titleMatch = text.match(/^title:\s*["']?(.*?)["']?\s*\r?$/m);
                        const descMatch = text.match(/^description:\s*["']?(.*?)["']?\s*\r?$/m);
                        const thumbMatch = text.match(/^thumbnail:\s*["']?(.*?)["']?\s*\r?$/m);
                        
                        const title = titleMatch ? titleMatch[1] : "Metro Speedcom Update";
                        const desc = descMatch ? descMatch[1] : "Read our latest announcement regarding copier and IT rentals.";
                        const img = thumbMatch ? thumbMatch[1] : "";
                        
                        // Grab date label from standard YYYY-MM-DD template prefix
                        const dateLabel = file.name.substring(0, 10); 

                        container.innerHTML += `
                            <article class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col md:flex-row hover:shadow-lg transition-all duration-300">
                                <div class="md:w-1/3 overflow-hidden bg-slate-100 flex items-center justify-center">
                                    <img src="${img}" class="w-full h-full object-cover min-h-[200px] hover:scale-105 transition-transform duration-500" onerror="this.src='/logo.PNG'">
                                </div>
                                <div class="p-8 md:w-2/3 flex flex-col justify-center">
                                    <div class="flex items-center gap-3 mb-4">
                                        <span class="px-3 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-full uppercase">Update</span>
                                        <span class="text-slate-400 text-xs font-medium"><i class="fa-regular fa-calendar-check mr-1"></i> ${dateLabel}</span>
                                    </div>
                                    <h2 class="text-2xl font-bold text-slate-900 mb-4 hover:text-blue-700 transition-colors">${title}</h2>
                                    <p class="text-slate-600 mb-6 leading-relaxed line-clamp-3">${desc}</p>
                                    <div>
                                        <a href="/article.html?post=${encodeURIComponent(file.name)}" class="inline-flex items-center gap-2 bg-blue-700 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-800 transition shadow-md hover:shadow-blue-200">
                                            Read Full Article <i class="fa-solid fa-arrow-right text-sm"></i>
                                        </a>
                                    </div>
                                </div>
                            </article>
                        `;
                    } catch (fileErr) {
                        console.error("Skipping single corrupted markdown file path:", fileErr);
                    }
                }
            } catch (err) {
                console.error("Blog Fetch Error:", err);
                showEmptyState(container);
            }
        }

        function showEmptyState(container) {
            container.innerHTML = `
                <div class="text-center py-20 bg-white rounded-3xl border-2 border-dashed border-slate-200">
                    <i class="fa-solid fa-box-open text-4xl text-slate-200 mb-4"></i>
                    <p class="text-slate-500 mb-2 text-lg">No published insights found right now.</p>
                    <p class="text-slate-400 text-sm mb-6">Make sure your markdown files are synchronized and built inside your site deploy folders.</p>
                    <a href="/admin/" class="inline-block bg-blue-700 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-blue-800 transition">
                        Write Your First Post
                    </a>
                </div>`;
        }

        // Run the fetch
        fetchPosts();
    </script>
</body>
</html>
